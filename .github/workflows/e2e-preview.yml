name: e2e-preview

# Smoke tests every Vercel preview deployment with the database-free specs.
#
# Security: this workflow reacts to `deployment_status`, which is triggered by pull request
# branches. It therefore NEVER checks out the deployed commit. It checks out the default branch
# (trusted code, reviewed and merged) and only points the browser at the preview URL, so pull
# request code cannot run next to the secrets below. The preview itself is untrusted: the bypass
# secret is sent to it as an HTTP header, so the secret lives in the GitHub Environment
# `preview-smoke` (restrict it to the main branch; previews of other branches then run without
# it), the job only runs for deployments created by Vercel, and the target must be a
# *.vercel.app host. Enable Vercel's approval for deployments from forks and rotate the secret if
# a preview is ever compromised.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: e2e-preview-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke test the preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment_status.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-smoke
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      DATABASE_URL: postgresql://auren:auren@localhost:5432/auren_ci
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - name: Refuse targets that are not Vercel preview hosts
        env:
          TARGET: ${{ github.event.deployment_status.environment_url }}
        run: |
          if ! printf '%s' "$TARGET" | grep -Eq '^https://[a-z0-9-]+\.vercel\.app/?$'; then
            echo "Refusing to test $TARGET" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted code only: never github.event.deployment.sha.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:run
        env:
          # Needed when Vercel Deployment Protection is on for previews. Only this step sees it.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7
