version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      day: monday
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
      include: scope
    groups:
      framework:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next']
      prisma:
        patterns: ['prisma', '@prisma/*']
      testing:
        patterns:
          [
            'vitest',
            '@vitest/*',
            '@playwright/*',
            'playwright*',
            '@axe-core/*',
            'testcontainers',
            '@testcontainers/*',
          ]
      lint:
        patterns:
          ['eslint*', '@typescript-eslint/*', 'typescript-eslint', 'prettier*', '@commitlint/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
